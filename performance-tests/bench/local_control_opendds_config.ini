# Control channel config for running every bench process on one host with all
# DDS traffic on loopback (see run_test.pl's --local-only).  Without multicast,
# SPDP is sent to the participant ports of the control domain (89).
[common]
DCPSGlobalTransportConfig=$file
DCPSDefaultDiscovery=fast_rtps
DCPSPendingTimeout=3
DCPSDefaultAddress=127.0.0.1

[rtps_discovery/fast_rtps]
ResendPeriod=1
SedpMulticast=0
SpdpSendAddrs=127.0.0.1:29660,127.0.0.1:29662,127.0.0.1:29664,127.0.0.1:29666,127.0.0.1:29668,127.0.0.1:29670,127.0.0.1:29672,127.0.0.1:29674,127.0.0.1:29676,127.0.0.1:29678
Ipv6SpdpLocalAddress=[::1]:0
Ipv6SedpLocalAddress=[::1]:0

[transport/the_rtps_transport]
transport_type=rtps_udp
max_bundle_size=64000
use_multicast=0
ipv6_local_address=[::1]:0
