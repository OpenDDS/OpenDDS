name: OpenDDS Performance Dashboard

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 6 * * 0'
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite
        required: true
        default: validation
        type: choice
        options: [validation, large-message, standard, core, full]
      manual_budget_override:
        description: Permit this run above the automatic budget cap
        required: true
        default: false
        type: boolean
      build_only:
        description: Build or verify the release bundle without starting AWS performance tests
        required: true
        default: false
        type: boolean
      repeat_run:
        description: Run again even when this exact revision and suite already completed
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: submit-opendds-performance
  cancel-in-progress: false

jobs:
  build-release:
    # Build only when this repository is configured to submit performance runs.
    if: >-
      vars.PERFORMANCE_AWS_ROLE_ARN != '' &&
      vars.PERFORMANCE_ARTIFACT_BUCKET != '' &&
      (github.event_name == 'workflow_dispatch' || vars.PERFORMANCE_AUTOMATIC_RUNS == 'true')
    runs-on: ubuntu-latest
    container: amazonlinux:2023
    env:
      ARTIFACT_BUCKET: ${{ vars.PERFORMANCE_ARTIFACT_BUCKET }}
      BUNDLE_VERSION: ${{ vars.PERFORMANCE_BUNDLE_VERSION || 'al2023-xerces-3.2.5-v5' }}
      OPENDDS_COMMIT: ${{ github.sha }}
    steps:
      - name: Install build prerequisites
        run: >-
          dnf install -y awscli-2 cmake diffutils findutils gcc gcc-c++ git gzip
          make openssl-devel patch perl tar which
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PERFORMANCE_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PERFORMANCE_AWS_REGION }}
      - name: Check release bundle
        id: bundle
        run: |
          key="builds/$BUNDLE_VERSION/$OPENDDS_COMMIT/bench.tar.gz"
          if aws s3api head-object --bucket "$ARTIFACT_BUCKET" --key "$key" >/dev/null 2>&1; then
            echo "Release bundle already exists: s3://$ARTIFACT_BUCKET/$key"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build Xerces-C++
        if: steps.bundle.outputs.exists != 'true'
        run: |
          git clone --depth 1 --branch v3.2.5 --single-branch https://github.com/apache/xerces-c.git /tmp/xerces-c
          cmake -S /tmp/xerces-c -B /tmp/xerces-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/xerces-install \
            -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build /tmp/xerces-build -j"$(nproc)"
          cmake --install /tmp/xerces-build
      - name: Build OpenDDS Bench release bundle
        if: steps.bundle.outputs.exists != 'true'
        run: |
          ./configure --optimize --no-debug --tests --rapidjson --security --xerces3=/tmp/xerces-install
          make -j"$(nproc)" \
            Bench_Worker Bench_node_controller Bench_test_controller \
            Bench_report_parser Bench_dashboard_summarizer \
            DCPSInfoRepo_Main RtpsRelay
          export DDS_ROOT="$GITHUB_WORKSPACE"
          (cd performance-tests/bench && perl install_bench.pl --dest /tmp/bundle)
          cp -L /tmp/xerces-install/lib/libxerces-c*.so* /tmp/bundle/lib/
          ldd /tmp/xerces-install/lib/libxerces-c.so | awk '/libicu/{print $3}' | xargs -r cp -L -t /tmp/bundle/lib/
          find . -type f -perm -111 \( -name DCPSInfoRepo -o -name RtpsRelay \) -exec cp {} /tmp/bundle/bin/ \;
          find . \( -type f -o -type l \) -name '*.so*' -exec cp -L {} /tmp/bundle/lib/ \;
          for executable in node_controller test_controller worker dashboard_summarizer DCPSInfoRepo RtpsRelay; do
            LD_LIBRARY_PATH=/tmp/bundle/lib ldd "/tmp/bundle/bin/$executable" | tee -a /tmp/ldd.log
          done
          ! grep -q 'not found' /tmp/ldd.log
          tar -C /tmp -czf /tmp/bench.tar.gz bundle
      - name: Upload release bundle
        if: steps.bundle.outputs.exists != 'true'
        run: |
          aws s3 cp /tmp/bench.tar.gz \
            "s3://$ARTIFACT_BUCKET/builds/$BUNDLE_VERSION/$OPENDDS_COMMIT/bench.tar.gz"

  submit:
    # Forks are manual-only unless PERFORMANCE_AUTOMATIC_RUNS is explicitly enabled.
    if: >-
      vars.PERFORMANCE_AWS_ROLE_ARN != '' &&
      inputs.build_only != true &&
      (github.event_name == 'workflow_dispatch' || vars.PERFORMANCE_AUTOMATIC_RUNS == 'true')
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Select suite
        id: suite
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SUITE: ${{ inputs.suite }}
          MANUAL_OVERRIDE: ${{ inputs.manual_budget_override }}
          REPEAT_RUN: ${{ inputs.repeat_run }}
          VALIDATION_INSTANCE_TYPE: ${{ vars.PERFORMANCE_VALIDATION_INSTANCE_TYPE }}
          STANDARD_INSTANCE_TYPE: ${{ vars.PERFORMANCE_STANDARD_INSTANCE_TYPE }}
          CORE_INSTANCE_TYPE: ${{ vars.PERFORMANCE_CORE_INSTANCE_TYPE }}
          FULL_INSTANCE_TYPE: ${{ vars.PERFORMANCE_FULL_INSTANCE_TYPE }}
        run: |
          if [[ "$EVENT_NAME" == schedule ]]; then
            suite=full
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            suite="$REQUESTED_SUITE"
          else
            # Keep automatic merged-commit runs within the commonly available
            # 32-vCPU On-Demand Standard quota. Core and full remain available
            # for manual dispatch after the target account's quota is raised.
            suite=standard
          fi
          case "$suite" in
            validation) topology='{"legCount":3,"coresPerLeg":1}'; estimated=1; instance_type="$VALIDATION_INSTANCE_TYPE" ;;
            large-message) topology='{"legCount":3,"coresPerLeg":1}'; estimated=1; instance_type="$VALIDATION_INSTANCE_TYPE" ;;
            standard) topology='{"legCount":6,"coresPerLeg":2}'; estimated=2; instance_type="$STANDARD_INSTANCE_TYPE" ;;
            core) topology='{"legCount":12,"coresPerLeg":4}'; estimated=8; instance_type="$CORE_INSTANCE_TYPE" ;;
            full) topology='{"legCount":30,"coresPerLeg":4}'; estimated=60; instance_type="$FULL_INSTANCE_TYPE" ;;
            *) exit 2 ;;
          esac
          [[ -n "$instance_type" ]] || { echo "No instance type configured for $suite" >&2; exit 2; }
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          echo "topology=$topology" >> "$GITHUB_OUTPUT"
          echo "estimated=$estimated" >> "$GITHUB_OUTPUT"
          echo "instance_type=$instance_type" >> "$GITHUB_OUTPUT"
          echo "override=${MANUAL_OVERRIDE:-false}" >> "$GITHUB_OUTPUT"
          if [[ "${REPEAT_RUN:-false}" == true ]]; then
            echo "repeat_nonce=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "repeat_nonce=" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve nightly configuration revision
        id: nightly
        env:
          PINNED_NIGHTLY_COMMIT: ${{ vars.PERFORMANCE_NIGHTLY_COMMIT }}
          NIGHTLY_REPOSITORY_URL: ${{ vars.PERFORMANCE_NIGHTLY_REPOSITORY_URL || 'https://github.com/OpenDDS/nightly.git' }}
          NIGHTLY_REF: ${{ vars.PERFORMANCE_NIGHTLY_REF || 'refs/heads/master' }}
        run: |
          sha="$PINNED_NIGHTLY_COMMIT"
          if [[ -z "$sha" ]]; then
            sha="$(git ls-remote "$NIGHTLY_REPOSITORY_URL" "$NIGHTLY_REF" | cut -f1)"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Could not resolve a valid nightly commit' >&2; exit 2; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PERFORMANCE_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PERFORMANCE_AWS_REGION }}
      - name: Submit benchmark workflow
        env:
          STATE_MACHINE_ARN: ${{ vars.PERFORMANCE_STATE_MACHINE_ARN }}
          COMMIT_SHA: ${{ github.sha }}
          CONFIG_COMMIT: ${{ steps.nightly.outputs.sha }}
          SUITE: ${{ steps.suite.outputs.suite }}
          TOPOLOGY: ${{ steps.suite.outputs.topology }}
          ESTIMATED_COST: ${{ steps.suite.outputs.estimated }}
          MANUAL_OVERRIDE: ${{ steps.suite.outputs.override }}
          INSTANCE_TYPE: ${{ steps.suite.outputs.instance_type }}
          AMI_ID: ${{ vars.PERFORMANCE_AMI_ID }}
          AVAILABILITY_ZONE: ${{ vars.PERFORMANCE_AVAILABILITY_ZONE }}
          REPEAT_NONCE: ${{ steps.suite.outputs.repeat_nonce }}
        run: |
          input=$(jq -n \
            --arg commitSha "$COMMIT_SHA" \
            --arg configCommit "$CONFIG_COMMIT" \
            --arg suite "$SUITE" \
            --argjson topology "$TOPOLOGY" \
            --argjson estimatedCostUsd "$ESTIMATED_COST" \
            --argjson manualOverride "$MANUAL_OVERRIDE" \
            --arg instanceType "$INSTANCE_TYPE" \
            --arg amiId "$AMI_ID" \
            --arg availabilityZone "$AVAILABILITY_ZONE" \
            --arg repeatNonce "$REPEAT_NONCE" \
            '{
              commitSha: $commitSha,
              configCommit: $configCommit,
              suite: $suite,
              topology: $topology,
              estimatedCostUsd: $estimatedCostUsd,
              manualOverride: $manualOverride,
              instanceType: $instanceType,
              amiId: $amiId,
              availabilityZone: $availabilityZone,
              repeatNonce: $repeatNonce
            }')
          aws stepfunctions start-execution \
            --state-machine-arn "$STATE_MACHINE_ARN" \
            --name "${COMMIT_SHA:0:12}-${SUITE}-${GITHUB_RUN_ID}" \
            --input "$input"
