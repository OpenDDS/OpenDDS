name: download and extract artifact
description: Download the artifact produced by an earlier job and extract its tar.xz.

inputs:
  job:
    description: Id of the job that produced the artifact
    required: true
  path:
    description: Directory to download and extract into
    required: true

runs:
  using: composite
  steps:
    - name: download ${{ inputs.job }} artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.job }}_artifact
        path: ${{ inputs.path }}
    - name: extract ${{ inputs.job }} artifact
      shell: bash
      env:
        ARTIFACT_PATH: ${{ inputs.path }}
        ARTIFACT_JOB: ${{ inputs.job }}
      run: |
        cd "$ARTIFACT_PATH"
        tar xvfJ "$ARTIFACT_JOB.tar.xz"
